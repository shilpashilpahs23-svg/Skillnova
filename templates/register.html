<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SkillNova</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                SkillNova
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join SkillNova and start exchanging skills.
            </p>


            <!-- REGISTER FORM -->

            <form method="POST">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            👁

                        </button>

                    </div>

                </div>


                <!-- College -->

                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college"
                        required>

                </div>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="auth-button">

                    Create Account

                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- PASSWORD SHOW/HIDE JAVASCRIPT -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const passwordInput =
                document.getElementById("password");

            const toggleButton =
                document.getElementById("togglePassword");


            toggleButton.addEventListener("click", function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    toggleButton.textContent = "🙈";

                } else {

                    passwordInput.type = "password";

                    toggleButton.textContent = "👁";

                }

            });

        });

    </script>

</body>

</html>
