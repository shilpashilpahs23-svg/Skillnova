<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SkillNova</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                SkillNova
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue your skill journey.
            </p>


            <form method="POST">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
